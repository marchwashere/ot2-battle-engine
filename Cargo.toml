[package]
name = "ot2-battle-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone headless OT2 battle simulation scaffold"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "ot2-sim"
path = "src/main.rs"
